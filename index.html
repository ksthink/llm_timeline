<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LLM TIMELINE</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23444'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23F4F269'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="toolbar">
      <p id="title">LLM 타임라인</p>
      <label>국가
        <select id="country">
          <option value="">전체</option>
        </select>
      </label>
      <label>모델
        <input id="model" list="model-list" placeholder="이름 검색" autocomplete="off" />
      </label>
      <datalist id="model-list"></datalist>
      <button type="button" id="clear-filter">초기화</button>
      <p id="count"></p>
    </div>
    <div id="stage">
      <div id="paper-container"></div>
      <p id="empty" hidden>조건에 맞는 모델이 없습니다.</p>
      <p id="hint">연도 점을 누르면 그 해 목록이 열립니다. 점 안의 그림은 대표 모델의 회사입니다.</p>
      <aside id="detail" hidden>
        <header>
          <div>
            <h2 id="detail-year"></h2>
            <p id="detail-meta"></p>
          </div>
          <button type="button" id="close-detail">닫기</button>
        </header>
        <ul id="detail-list"></ul>
      </aside>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
